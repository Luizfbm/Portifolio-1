<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>Luiz Filipe Miranda, desenvolvedor full stack</title>
    <meta
      name="description"
      content="Portfólio de Luiz Filipe Miranda, desenvolvedor full stack em Vitória/ES. Experiência em ERP, saúde, educação e atendimento, com cases abertos de arquitetura e código."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Luiz Filipe Miranda, desenvolvedor full stack" />
    <meta
      property="og:description"
      content="Full stack que pega operação confusa e deixa no ar. Cases com arquitetura, decisões e código."
    />
    <meta property="og:image" content="/assets/luiz-portrait.png" />
    <script>
      // Evita o flash de tema errado: o modo é resolvido antes da primeira pintura.
      (() => {
        try {
          const stored = localStorage.getItem('luz:theme');
          const theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
        } catch {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
